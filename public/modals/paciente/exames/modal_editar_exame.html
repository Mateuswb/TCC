<div id="modalAgendamento" class="modal">
  <div class="modal-content">
    
    <span class="fechar-modal-exame" id="fecharModalAgendamento">&times;</span>

    <div class="modal-header">
      <div class="header-left">
        <img src="../../../../public/assets/icones/medico.png" alt="Foto do Profissional">
        <div class="header-info">
          <h2 id="nomeProfissional"></h2>
        </div>
      </div>
      <div class="header-title">
        <h3>Editar Exame</h3>
        <span>Informe os detalhes necessários para edição do agendamento</span>
      </div>
    </div>

    <div class="container-modal">
      <h3>Confirme os dados para edição do agendamento</h3>

      <form action="../../../../controllers/AgendamentoExameController.php?acao=editarExame" 
            method="post" id="formAgendar" enctype="multipart/form-data">

        <input type="hidden" name="idAgendamentoExame" id="idAgendamentoExame">
        <input type="hidden" name="nomeExame" id="exame">

        <div class="form-control">
          <label for="diaAgendamento">Dia do Exame</label>
          <input type="date" id="diaAgendamento" name="diaAgendamento" required>
        </div>

        <div class="form-control">
          <label for="profissionais">Profissional</label>
          <select name="profissional" id="profissionais">
            <option value="">Selecione um profissional</option>
          </select>
        </div>

        <div id="mensagemErro" class="mensagem-erro" style="display:none;"></div>

        <div class="form-control">
          <label for="horarioAgendamento">Escolha o Horário</label>
          <div id="mensagemHorario">Selecione um dia e um profissional para ver os horários disponíveis.</div>
          <div id="times" class="times"></div>
        </div>

        <div class="form-control">
          <label for="observacao">Observações</label>
          <textarea id="observacao" name="observacoes" placeholder="Escreva alguma observação..."></textarea>
        </div>

        <input type="submit" class="btn-agendarConsulta" value="Agendar">
      </form>

    </div>
      <div class="modal-footer">
        <p><strong>Clínica MedHub</strong><br>
        Av. Santa, 9999 - Centro, Santa Catarina - SC</p>
      </div>

  </div>
</div>

<link rel="stylesheet" href="../../../../public/assets/css/geral/agendamento_exame.css">

<script>
  const formAgendarExame = document.getElementById('formAgendarExame');
  const diaAgendamento = document.getElementById('diaAgendamento');
  const exame = document.getElementById('exame');
  const profissionaisSelect = document.getElementById('profissionais');
  const container = document.getElementById('times');
  const mensagemErro = document.getElementById('mensagemErro');
  const mensagemHorario = document.getElementById('mensagemHorario');
  const nomeProfissionalEl = document.getElementById('nomeProfissional');
  const modal = document.getElementById('modalAgendamento');
  const closeModal = document.getElementById('fecharModalAgendamento');
  
  const showError = (msg) => {
    mensagemErro.style.display = 'block';
    mensagemErro.innerText = msg;
  };

  const buscarHorarios = () => {
  const data = diaAgendamento.value;
  const nomeExame = exame.value;

  const nomeProfissionalAtual = profissionaisSelect.value || window.nomeProfissionalGlobal || '';

  container.innerHTML = '';
  mensagemErro.style.display = mensagemHorario.style.display = 'none';

  fetch('../../../../controllers/ExameController.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `data=${encodeURIComponent(data)}&exame=${encodeURIComponent(nomeExame)}`
  })
  .then(r => r.json())
  .then(retorno => {
    if (retorno.erro) return showError(retorno.erro);

    if (Array.isArray(retorno)) {
      if (retorno.length === 0) {
        mensagemHorario.style.display = 'block';
        mensagemHorario.innerText = 'Não há horários disponíveis para este dia.';
        return;
      }

      mensagemHorario.style.display = 'block';
      mensagemHorario.innerText = 'Escolha um horário:';
      container.innerHTML = retorno.map(h => `
        <label class="time-slot">
          <input type="radio" name="horarioAgendamento" value="${h}" required>
          <span>${h}</span>
        </label>
      `).join('');
      return;
    }
    
    profissionaisSelect.innerHTML = `<option value="${nomeProfissionalAtual}" selected>${nomeProfissionalAtual}</option>`;
    profissionaisSelect.disabled = true;

    const horarios = retorno[nomeProfissionalAtual] || [];
    if (!horarios || horarios.length === 0) {
      mensagemHorario.style.display = 'block';
      mensagemHorario.innerText = 'Nenhum horário disponível para este profissional neste dia.';
      return;
    }

    mensagemHorario.style.display = 'block';
    mensagemHorario.innerText = 'Escolha um horário:';
    container.innerHTML = horarios.map(h => `
      <label class="time-slot">
        <input type="radio" name="horarioAgendamento" value="${h}" required>
        <span>${h}</span>
      </label>
    `).join('');
  })
  .catch(() => showError('Erro ao carregar horários. Tente novamente.'));
  };


  closeModal?.addEventListener('click', () => modal.style.display = 'none');
  window.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });

  diaAgendamento.addEventListener('change', buscarHorarios);


  function abrirModalAgendamento(idAgendamento, dia, horario, descricao, nomeExame, nomeProfissional) {
    document.getElementById('idAgendamentoExame').value = idAgendamento || '';
    diaAgendamento.value = dia || '';
    exame.value = nomeExame || '';
    profissionaisSelect.innerHTML = `<option value="${nomeProfissional}" selected>${nomeProfissional}</option>`;
    profissionaisSelect.disabled = true;
    nomeProfissionalEl.innerText = nomeProfissional || 'Profissional';
    document.getElementById('observacao').value = descricao || '';

    modal.style.display = 'flex';
    setTimeout(buscarHorarios, 200);
  }

  fecharModalAgendamento.addEventListener('click', () => {
    modalAgendamento.style.display = 'none';
  });

</script>
