<script>
document.addEventListener("DOMContentLoaded", () => {
  const modalAgendamento = document.getElementById("modalAgendamento");
  const fecharModalAgendamento = document.getElementById("fecharModalAgendamento");
  const formAgendar = document.getElementById("formAgendar");
  const diaAgendamento = document.getElementById("diaAgendamento");
  const container = document.getElementById("times");
  const mensagemErro = document.getElementById("mensagemErro");
  const mensagemHorario = document.getElementById("mensagemHorario");
  const exame = document.getElementById("exame");

  const showError = (msg) => {
    mensagemErro.style.display = "block";
    mensagemErro.innerText = msg;
  };

  const buscarHorarios = () => {
    const dataSelecionada = diaAgendamento.value;
    const exameSelecionado = exame.value;

    container.innerHTML = "";
    mensagemErro.style.display = mensagemHorario.style.display = "none";

    if (!dataSelecionada) {
      mensagemHorario.style.display = "block";
      mensagemHorario.innerText = "Selecione um dia para ver os horários disponíveis.";
      return;
    }

    console.log(dataSelecionada);
    console.log(exameSelecionado);

    fetch("../../../../controllers/ExameController.php", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `data=${encodeURIComponent(dataSelecionada)}&exame=${encodeURIComponent(exameSelecionado)}`
    })
      .then((r) => r.json())
      .then((retorno) => {
        if (retorno.erro) return showError(retorno.erro);

        if (retorno.length === 0) {
          mensagemHorario.style.display = "block";
          mensagemHorario.innerText = "Não há horários disponíveis para este dia.";
          return;
        }

        mensagemHorario.style.display = "block";
        mensagemHorario.innerText = "Escolha um horário:";
        container.innerHTML = retorno.map((h) => `
          <label class="time-slot">
            <input type="radio" name="horarioAgendamento" value="${h}" required>
            <span>${h}</span>
          </label>
        `).join("");
      })
      .catch(() => showError("Erro ao carregar horários. Tente novamente."));
  };

  diaAgendamento.addEventListener("change", buscarHorarios);


  window.abrirModalAgendamento = function (idAgendamento, dia, observacao, exame, profissional) {
    document.getElementById("idAgendamentoExame").value = idAgendamento;
    document.getElementById("diaAgendamento").value = dia || "";
    document.getElementById("observacao").value = observacao || "";
    document.getElementById("exame").value = profissional || "";
    document.getElementById("nomeProfissional").innerText = profissional;

    modalAgendamento.style.display = "flex";

    setTimeout(buscarHorarios, 200);
  };

  fecharModalAgendamento.addEventListener("click", () => {
    modalAgendamento.style.display = "none";
  });

  window.addEventListener("click", (e) => {
    if (e.target === modalAgendamento) modalAgendamento.style.display = "none";
  });

  formAgendar.addEventListener("submit", (e) => {
    const horarioSelecionado = document.querySelector('input[name="horarioAgendamento"]:checked');
    mensagemErro.style.display = "none";

    if (!horarioSelecionado) {
      e.preventDefault();
      return showError("Por favor, selecione um horário antes de agendar.");
    }
  });
});



</script>
