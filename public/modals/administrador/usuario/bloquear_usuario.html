<div id="modalBloquearUsuario" class="modal">
  <div class="modal-content bloquear">
    <span class="close" id="closeModalBloq">&times;</span>
    <h2>⚠️ Bloquear Usuário</h2>
    <p id="mensagemBloqueio">
      Tem certeza que deseja bloquear este usuário? 
      <strong>Ele não poderá mais acessar o sistema até que seja desbloqueado.</strong>
    </p>

    <form action="../../../controllers/AdministradorController.php?acao=bloquearUsuario" method="POST" id="formBloquearUsuario">
      <input type="hidden" name="idUsuario" id="bloquear_id_usuario">

      <div class="form-buttonsB">
        <button type="button" class="btn cancel" id="cancelModalBloq">Cancelar</button>
        <button type="submit" name="acao" value="bloquear" class="btn bloquear">Bloquear</button>
      </div>
    </form>
  </div>
</div>

<style>
.modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.55);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
}

.modal.show {
    opacity: 1;
    visibility: visible;
}

.modal-content {
    background-color: #fff;
    padding: 25px 30px;
    border-radius: 14px;
    width: 90%;
    max-width: 440px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    position: relative;
    transform: translateY(-20px);
    transition: transform 0.3s ease;
}

.modal.show .modal-content {
    transform: translateY(0);
}

.modal-content.bloquear {
    border-top: 6px solid #caa916;
}

.modal-content.bloquear h2 {
    color: #b19414;
    text-align: center;
    margin-bottom: 15px;
}

.modal-content.bloquear p {
    color: #444;
    text-align: center;
    font-size: 15px;
}

.modal-content.bloquear strong {
    color: #1b1b1b;
}

.close {
    position: absolute;
    top: 15px; right: 20px;
    font-size: 24px;
    cursor: pointer;
    color: #777;
}

.close:hover { color: #000; }

.form-buttonsB {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 25px;
}

.btn {
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 20px;
    transition: background-color 0.25s ease, transform 0.15s ease;
}

.btn:hover {
    transform: translateY(-2px);
}

.btn.cancel {
  font-size: 19px;
  background-color: #f3f4f6;
  color: #333;
}

.btn.cancel:hover {
    background-color: #b8b8b8;
}

.btn.bloquear {
  font-size: 19px;
  background-color: #dcbb26;
  color: #ffffff;
  box-shadow: 0 2px 10px rgba(220,38,38,0.3);
}

.btn.bloquear:hover {
    background-color: #ceac14;
}

@media (max-width:500px){
    .modal-content{padding:20px;}
    .form-buttonsB{flex-direction:column-reverse;}
    .form-buttonsB .btn{width:100%;}
}
</style>


<script>
const modalBloq = document.getElementById("modalBloquearUsuario");
const closeBloq = document.getElementById("closeModalBloq");
const cancelBloq = document.getElementById("cancelModalBloq");
const inputBloqId = document.getElementById("bloquear_id_usuario");

function abrirModalBloquear(btn) {
  inputBloqId.value = btn.dataset.id;
  modalBloq.classList.add("show");
}

function fecharModalBloquear() {
  modalBloq.classList.remove("show");
}

closeBloq.onclick = fecharModalBloquear;
cancelBloq.onclick = fecharModalBloquear;

window.addEventListener("click", (e) => {
  if(e.target === modalBloq) fecharModalBloquear();
});
</script>
