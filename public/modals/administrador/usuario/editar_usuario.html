<!-- Modal Editar Usuário -->
<div id="modalEditarUsuario" class="modal">
  <div class="modal-content">
    <span class="close" id="closeModal">&times;</span>
    <h2>Editar Usuário</h2>
    <form id="formEditarUsuario" method="post" action="../../../controllers/AdministradorController.php">
      <input type="hidden" name="id_usuario" id="id_usuario">
      
      <div class="form-control">
        <label for="login">Login</label>
        <input type="text" name="login" id="login" required>
      </div>

      <div class="form-control">
        <label for="tipo_usuario">Tipo de Usuário</label>
        <select name="tipo_usuario" id="tipo_usuario" required>
          <option value="admin">Administrador</option>
          <option value="user">Usuário</option>
        </select>
      </div>

      <div class="form-control">
        <label for="senha">Nova Senha <small>(opcional)</small></label>
        <input type="password" name="senha" id="senha" placeholder="Deixe em branco para não alterar">
      </div>

      <div class="form-buttons">
        <button type="submit" class="btn save">Salvar</button>
        <button type="button" class="btn cancel" id="cancelModal">Cancelar</button>
      </div>
    </form>
  </div>
</div>



  <style>
   .modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0; top: 0;
  width: 100%; height: 100%;
  overflow: auto;
  background-color: rgba(0,0,0,0.6);
  font-family: "Poppins", sans-serif;
}

.modal-content {
  background-color: #fff;
  margin: 80px auto;
  padding: 30px 40px;
  border-radius: 12px;
  width: 450px;
  max-width: 90%;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  position: relative;
  animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
  from { transform: translateY(-50px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-content h2 {
  text-align: center;
  color: #004aad;
  margin-bottom: 24px;
  font-size: 24px;
}

.modal-content .form-control {
  margin-bottom: 18px;
}

.modal-content label {
  display: block;
  margin-bottom: 6px;
  font-weight: 600;
  color: #222;
}

.modal-content input,
.modal-content select {
  width: 100%;
  padding: 10px 12px;
  font-size: 16px;
  border: 2px solid #ccc;
  border-radius: 8px;
  outline: none;
  transition: all 0.2s;
}

.modal-content input:focus,
.modal-content select:focus {
  border-color: #004aad;
  box-shadow: 0 0 8px rgba(0,74,173,0.3);
}

.modal-content .form-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 20px;
}

.modal-content .btn.save {
  background-color: #004aad;
  color: #fff;
  border: none;
  padding: 10px 20px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.modal-content .btn.save:hover {
  background-color: #003b88;
}

.modal-content .btn.cancel {
  background-color: #ccc;
  color: #222;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.modal-content .btn.cancel:hover {
  background-color: #bbb;
}

.modal-content .close {
  position: absolute;
  right: 18px;
  top: 18px;
  font-size: 28px;
  font-weight: bold;
  color: #333;
  cursor: pointer;
  transition: color 0.2s;
}

.modal-content .close:hover {
  color: #004aad;
}

  </style>


<script>
const modalEditar = document.getElementById("modalEditarUsuario");
const closeModal = document.getElementById("closeModal");
const cancelModal = document.getElementById("cancelModal");

function abrirModalEditarUsuario(botao) {
  modalEditar.style.display = "block";

  // Preenche os campos com os data-attributes do botão
  document.getElementById("id_usuario").value = botao.getAttribute("data-id");
  document.getElementById("login").value = botao.getAttribute("data-login");
  document.getElementById("tipo_usuario").value = botao.getAttribute("data-tipo");
  document.getElementById("senha").value = ""; // deixa em branco
}

// Fechar modal
closeModal.onclick = () => modalEditar.style.display = "none";
cancelModal.onclick = () => modalEditar.style.display = "none";

window.onclick = function(event) {
  if (event.target == modalEditar) {
    modalEditar.style.display = "none";
  }
}
</script>
