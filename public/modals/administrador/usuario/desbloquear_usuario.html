<div id="modalDesbloquearUsuario" class="modal">
  <div class="modal-content desbloquear">
    <span class="close" id="closeModalDesbloq">&times;</span>
    <h2>✔️ Desbloquear Usuário</h2>
    <p id="mensagemDesbloqueio">
      Tem certeza que deseja desbloquear este usuário?
      <strong>Ele poderá voltar a acessar o sistema normalmente.</strong>
    </p>

    <form action="../../../controllers/AdministradorController.php?acao=desbloquearUsuario" method="POST" id="formDesbloquearUsuario">
      <input type="hidden" name="idUsuario" id="desbloquear_id_usuario">

      <div class="form-buttonsB">
        <button type="button" class="btn cancel" id="cancelModalDesbloq">Cancelar</button>
        <button type="submit" name="acao" value="desbloquear" class="btn desbloquearBtn">Desbloquear</button>
      </div>
    </form>
  </div>
</div>

<style>
.modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.55);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
}

.modal.show {
    opacity: 1;
    visibility: visible;
}

.modal-content {
    background-color: #fff;
    padding: 25px 30px;
    border-radius: 14px;
    width: 90%;
    max-width: 440px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    position: relative;
    transform: translateY(-20px);
    transition: transform 0.3s ease;
}

.modal.show .modal-content {
    transform: translateY(0);
}



.modal-content.desbloquear {
    border-top: 6px solid #27ae60;
}

.modal-content.desbloquear h2 {
    color: #1f8a4d;
    text-align: center;
    margin-bottom: 15px;
}

.modal-content.desbloquear p {
    color: #333;
    text-align: center;
    font-size: 15px;
}

.modal-content.desbloquear strong {
    color: #111;
}


.btn.desbloquearBtn {
    font-size: 19px;
    background-color: #27ae60;
    color: #ffffff;
    box-shadow: 0 2px 10px rgba(39,174,96,0.3);
}

.btn.desbloquearBtn:hover {
    background-color: #1f8a4d;
}

</style>

<script>
  const modalDesbloq = document.getElementById("modalDesbloquearUsuario");
  const closeDesbloq = document.getElementById("closeModalDesbloq");
  const cancelDesbloq = document.getElementById("cancelModalDesbloq");
  const inputDesbloqId = document.getElementById("desbloquear_id_usuario");

  function abrirModalDesbloquear(btn) {
    inputDesbloqId.value = btn.dataset.idDesbloquear;
    modalDesbloq.classList.add("show");
  }

  function fecharModalDesbloquear() {
    modalDesbloq.classList.remove("show");
  }

  closeDesbloq.onclick = fecharModalDesbloquear;
  cancelDesbloq.onclick = fecharModalDesbloquear;

  window.addEventListener("click", (e) => {
    if(e.target === modalDesbloq) fecharModalDesbloquear();
  });
</script>
