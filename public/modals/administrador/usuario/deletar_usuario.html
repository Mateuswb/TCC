<!-- Modal Deletar Usuário -->
<div id="modalDeletarUsuario" class="modal">
  <div class="modal-content">
    <span class="close" id="closeModalDelete">&times;</span>
    <h2>Excluir Usuário</h2>
    <p id="mensagemDelete">
      Tem certeza que deseja deletar este usuário? Esta ação não pode ser desfeita e todos os dados pentinentes a ele serão permanentemente exluídos.
    </p>

    <form id="formDeletarUsuario" method="post" action="../../../controllers/AdministradorController.php?acao=deletarUsuario">
      <input type="hidden" name="idUsuario" id="delete_id_usuario">
      <input type="hidden" name="cpf" id="delete_cpf_usuario">

      <div class="form-buttons">
        <button type="submit" class="btn save">Confirmar</button>
        <button type="button" class="btn cancel" id="cancelModalDelete">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<style>
.modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-color: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  visibility: hidden;
  z-index: 1000;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.modal.show {
  opacity: 1;
  visibility: visible;
}

.modal-content {
  background-color: #fff;
  padding: 30px 40px;
  border-radius: 12px;
  width: 400px;
  max-width: 90%;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  position: relative;
  transform: translateY(-20px);
  transition: transform 0.3s ease;
}

.modal.show .modal-content {
  transform: translateY(0);
}

.modal-content h2 {
  color: #d90429;
  text-align: center;
  margin-bottom: 20px;
}

.modal-content p {
  text-align: center;
  margin-bottom: 24px;
}

.modal-content .form-buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
}

.modal-content .btn.save {
  background-color: #d90429;
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

.modal-content .btn.save:hover {
  background-color: #b80022;
}

.modal-content .btn.cancel {
  background-color: #ccc;
  color: #222;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
}

.modal-content .close {
  position: absolute;
  right: 18px;
  top: 18px;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
}
</style>

<script>
const modalDelete = document.getElementById("modalDeletarUsuario");
const closeDelete = document.getElementById("closeModalDelete");
const cancelDelete = document.getElementById("cancelModalDelete");
const inputDeleteId = document.getElementById("delete_id_usuario");
const inputDeleteCpf = document.getElementById("delete_cpf_usuario");

function abrirModalDeletarUsuario(botao) {
  inputDeleteId.value = botao.dataset.id;
  inputDeleteCpf.value = botao.dataset.cpf;
  modalDelete.classList.add("show");
}

function fecharModalDeletarUsuario() {
  modalDelete.classList.remove("show");
}

closeDelete.onclick = fecharModalDeletarUsuario;
cancelDelete.onclick = fecharModalDeletarUsuario;

window.addEventListener("click", e => {
  if(e.target === modalDelete) fecharModalDeletarUsuario();
});
</script>
